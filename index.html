<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Sintetiza Hub: resumos personalizados com inteligência artificial.">

    <title>Sintetiza Hub</title>

    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="js/app.js"></script>
</head>

<body>

    <header class="site-header">
        <a href="index.html" class="brand" aria-label="Sintetiza Hub - início">
            <span class="brand-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M12 2.8L14.1 9.9L21.2 12L14.1 14.1L12 21.2L9.9 14.1L2.8 12L9.9 9.9L12 2.8Z"
                        stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
                    <path d="M19 15.5L19.8 18.2L22.5 19L19.8 19.8L19 22.5L18.2 19.8L15.5 19L18.2 18.2L19 15.5Z"
                        fill="currentColor" />
                </svg>
            </span>

            <span class="brand-name">sintetiza <strong>hub</strong></span>
        </a>

        <span class="header-motto">per aspera ad astra</span>
    </header>

    <main class="container">

        <div class="workspace">

            <section class="panel input-panel" aria-labelledby="input-title">

                <form id="summary-form">

                    <div class="section-heading">
                        <h1 id="input-title">Texto de entrada</h1>
                        <span class="step-label">01 / ENTRADA</span>
                    </div>

                    <div class="textarea-wrapper">
                        <label for="source-text" class="sr-only">
                            Texto que deseja resumir
                        </label>

                        <textarea id="source-text" name="source-text" rows="10" maxlength="10000"
                            placeholder="Cole ou digite seu texto aqui..." aria-invalid="false"></textarea>
                    </div>

                    <div class="field-footer">
                        <p class="character-count">
                            <span id="character-count">0</span> / 10.000
                        </p>
                    </div>

                    <section class="options-section" aria-label="Configurações do resumo">

                        <fieldset class="option-group">
                            <legend>Tamanho do resumo</legend>

                            <div class="choice-grid">

                                <label class="choice-card">
                                    <input type="radio" name="summary-length" value="short">
                                    <span class="choice-content">Curto</span>
                                </label>

                                <label class="choice-card">
                                    <input type="radio" name="summary-length" value="medium" checked>
                                    <span class="choice-content">Médio</span>
                                </label>

                                <label class="choice-card">
                                    <input type="radio" name="summary-length" value="long">
                                    <span class="choice-content">Detalhado</span>
                                </label>

                            </div>
                        </fieldset>

                        <fieldset class="option-group format-group">
                            <legend>Formato</legend>

                            <div class="format-options">

                                <label class="format-option">
                                    <input type="radio" name="summary-format" value="paragraph" checked>
                                    <span class="format-content">Texto corrido</span>
                                </label>

                                <label class="format-option">
                                    <input type="radio" name="summary-format" value="topics">
                                    <span class="format-content">Tópicos</span>
                                </label>

                            </div>
                        </fieldset>

                    </section>

                    <button type="submit" id="summarize-button">
                        Gerar resumo
                        <span aria-hidden="true">→</span>
                    </button>

                    <p id="status-message" class="status-message" role="status" aria-live="polite"></p>

                </form>

            </section>

            <section class="panel result-panel" aria-labelledby="result-title">

                <div class="section-heading">
                    <h2 id="result-title">Resumo gerado</h2>
                    <span class="step-label">02 / RESULTADO</span>
                </div>

                <div id="result-placeholder" class="result-placeholder">
                    <span class="placeholder-icon" aria-hidden="true">✳</span>
                    <p>O resumo aparecerá aqui.</p>
                </div>

                <div id="summary-text" class="summary-text" hidden></div>

            </section>

        </div>

    </main>

    <footer class="site-footer">
        <a href="https://github.com/Wendel-Costa" target="_blank" rel="noopener noreferrer">
            Sintetiza Hub &copy; 2026 - Feito por Wendel Costa
        </a>
    </footer>

</body>

</html>
